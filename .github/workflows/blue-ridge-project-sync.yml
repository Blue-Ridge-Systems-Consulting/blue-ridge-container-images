name: Blue Ridge Project Sync

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr:
        description: "Merged pull request number to replay"
        required: true
        type: number

permissions: {}

jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.BLUE_RIDGE_PROJECT_SYNC_DISPATCH_TOKEN }}
      PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr || github.event.pull_request.number }}
    steps:
      - name: Dispatch merged pull request to the central Project Sync
        run: |
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "BLUE_RIDGE_PROJECT_SYNC_DISPATCH_TOKEN is not configured." >&2
            exit 1
          fi
          gh api --method POST \
            repos/Blue-Ridge-Systems-Consulting/.github/actions/workflows/project-sync.yml/dispatches \
            -f ref=main \
            -f "inputs[repository]=${GITHUB_REPOSITORY}" \
            -F "inputs[pr]=${PR_NUMBER}" \
            -f 'inputs[write]=true'
