name: Publish Reo Laptop Containers

on:
  workflow_dispatch:
    inputs:
      source_images:
        description: Comma-separated local source references (reo-ai, ray-tools, olmoai, and/or apertusai; ray-tools publishes as reo-tools)
        required: true
        default: localhost/reo-ai:fedora44-20260915,localhost/ray-tools:ui-parity-20261020
        type: string
      publish:
        description: Push the selected images to GHCR (leave unchecked to validate only)
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-reo-laptop-containers
  cancel-in-progress: false

jobs:
  publish:
    name: Publish selected Reo Laptop images
    runs-on: [self-hosted, Linux, X64, reo-fedora45-images]
    timeout-minutes: 45

    steps:
      - name: Check out the image gateway client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare the scoped image gateway credential
        shell: bash
        env:
          REO_IMAGE_HOST_SSH_KEY: ${{ secrets.REO_IMAGE_HOST_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$REO_IMAGE_HOST_SSH_KEY"
          key_file="$(mktemp "$RUNNER_TEMP/reo-image-host.XXXXXXXX")"
          printf '%s\n' "$REO_IMAGE_HOST_SSH_KEY" > "$key_file"
          printf 'REO_IMAGE_HOST_KEY_FILE=%s\n' "$key_file" >> "$GITHUB_ENV"

      - name: Validate selected local images
        id: images
        shell: bash
        env:
          SOURCE_IMAGES: ${{ inputs.source_images }}
        run: |
          set -euo pipefail
          IFS=',' read -r -a images <<< "$SOURCE_IMAGES"
          ((${#images[@]} > 0)) || { echo 'No images were selected.' >&2; exit 1; }

          : > "$RUNNER_TEMP/images.tsv"
          declare -A seen=()
          for source in "${images[@]}"; do
            source="${source//[[:space:]]/}"
            [[ "$source" =~ ^localhost/(reo-ai|ray-tools|olmoai|apertusai):[A-Za-z0-9._-]+$ ]] || {
              echo "Unsupported source image: $source" >&2
              echo 'Only localhost/reo-ai, localhost/ray-tools, localhost/olmoai, and localhost/apertusai are allowed.' >&2
              exit 1
            }
            source_name="${BASH_REMATCH[1]}"
            case "$source_name" in
              ray-tools) name="reo-tools" ;;
              *) name="$source_name" ;;
            esac
            [[ -z "${seen[$name]:-}" ]] || { echo "Duplicate image: $name" >&2; exit 1; }
            seen[$name]=1
            bash scripts/reo-image-host-podman.sh image exists "$source" || { echo "Local image not found: $source" >&2; exit 1; }
            image_id="$(bash scripts/reo-image-host-podman.sh image inspect --format '{{.Id}}' "$source")"
            printf '%s\t%s\t%s\n' "$name" "$source" "$image_id" | tee -a "$RUNNER_TEMP/images.tsv"
          done

      - name: Show planned publication
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r name source image_id; do
            echo "$source ($image_id) -> ghcr.io/blue-ridge-systems-consulting/$name:blue-ridge-public"
            echo "$source ($image_id) -> ghcr.io/blue-ridge-systems-consulting/$name:reo-laptop-${GITHUB_RUN_ID}"
          done < "$RUNNER_TEMP/images.tsv"

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | bash scripts/reo-image-host-podman.sh login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Tag and publish selected images
        if: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r name source image_id; do
            stable="ghcr.io/blue-ridge-systems-consulting/$name:blue-ridge-public"
            immutable="ghcr.io/blue-ridge-systems-consulting/$name:reo-laptop-${GITHUB_RUN_ID}"
            bash scripts/reo-image-host-podman.sh tag "$source" "$stable"
            bash scripts/reo-image-host-podman.sh tag "$source" "$immutable"
            bash scripts/reo-image-host-podman.sh push "$stable"
            bash scripts/reo-image-host-podman.sh push "$immutable"
          done < "$RUNNER_TEMP/images.tsv"

      - name: Log out of GitHub Container Registry
        if: ${{ always() && inputs.publish }}
        shell: bash
        run: bash scripts/reo-image-host-podman.sh logout ghcr.io || true

      - name: Verify anonymous public pulls
        if: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r name source image_id; do
            bash scripts/reo-image-host-podman.sh pull --quiet "ghcr.io/blue-ridge-systems-consulting/$name:blue-ridge-public"
          done < "$RUNNER_TEMP/images.tsv"

      - name: Remove the temporary gateway credential
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -n "${REO_IMAGE_HOST_KEY_FILE:-}" ]]; then
            rm -f -- "$REO_IMAGE_HOST_KEY_FILE"
          fi
